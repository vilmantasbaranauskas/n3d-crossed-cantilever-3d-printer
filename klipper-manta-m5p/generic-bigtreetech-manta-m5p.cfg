# This file contains common pin mappings for the BIGTREETECH Manta M5P
# To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" "8 MHz crystal"
# and "USB (on PA11/PA12)" or "CAN bus (on PD0/PD1)".

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: PC8
dir_pin: !PC9
enable_pin: !PA15
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 183.5
position_max: 183.5
homing_speed: 20
homing_retract_dist: 0

[stepper_y]
step_pin: PA10
dir_pin: !PA14
enable_pin: !PA13
endstop_pin: tmc2209_stepper_y:virtual_endstop
microsteps: 16
rotation_distance: 32
#endstop_pin: ^PD2
position_endstop: 183.5
position_max: 183.5
homing_speed: 20
homing_retract_dist: 0

[stepper_z]
step_pin: PC6
dir_pin: PC7
enable_pin: !PA9
microsteps: 16
rotation_distance: 30
gear_ratio: 3:1
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 166
homing_speed: 10
homing_retract_dist: 2.0
second_homing_speed: 6

[stepper_z1]
step_pin: !PB0
dir_pin: PB1
enable_pin: !PC4
microsteps: 16
rotation_distance: 30
gear_ratio: 3:1

#[z_tilt]
#speed: 120
#z_positions:
#  90, 250
#  250, 90
#points:
#  110,183
#  183,110

[extruder]
step_pin: PB12
dir_pin: !PB11
enable_pin: !PA8
microsteps: 16
rotation_distance: 22.62
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC5
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA1
control: pid
pid_Kp=29.845
pid_Ki=3.491
pid_Kd=63.793
min_temp: 10
max_temp: 270
min_extrude_temp: 180

#[filament_switch_sensor material_0]
#switch_pin: PC2

[heater_bed]
heater_pin: PA5
sensor_type: Generic 3950
sensor_pin: PA0
min_temp: 0
max_temp: 90
control: watermark
max_delta: 0.3
#control: pid
#pid_Kp=55
#pid_Ki=0.787
#pid_Kd=337.0

[fan]
pin: PA4
off_below: 0.20

#[fan_generic vbtest]
#pin: CB1:gpio76
#shutdown_speed: 1.0

#[heater_fan fan1]
#pin: PA3

[heater_fan Heater-Fan]
pin: PA3
#off_below: 0.2
#fan_speed: 0.7
#   The fan speed (expressed as a value from 0.0 to 1.0) that the fan
#   will be set to when a heater or stepper driver is active.
#   The default is 1.0
#heater: extruder
#stepper: stepper_x, stepper_y
#idle_timeout: 300

#pin: CB1: gpio79
#pin: RPI: gpio26

[temperature_fan SoC_fan]
pin: CB1:gpio79
kick_start_time: 0.4
off_below: 0.3
max_power: 1.0
sensor_type: temperature_host
control: pid
min_temp: 10
max_temp: 90
pid_kp: 1.0
pid_ki: 0.5
pid_kd: 2.0
min_speed: 0.6
max_speed: 1.0
target_temp: 55
cycle_time: 0.01
#hardware_pwm: True

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_31004F000C504B5735313920-if00

[printer]
kinematics: cartesian
max_velocity: 800
max_accel: 12000
max_z_velocity: 150
max_z_accel: 2000

[idle_timeout]
gcode:
   TURN_OFF_HEATERS
   SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
   SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
   SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
timeout: 600

[gcode_arcs]
resolution: 0.6

########################################
# TMC2209 configuration
########################################

[tmc2209 stepper_x]
uart_pin: PD9
run_current: 0.800
stealthchop_threshold: 999999
;hold_current: 0.200
diag_pin: ^PD3
driver_SGTHRS: 50
#interpolate: False

[tmc2209 stepper_y]
uart_pin: PD8
run_current: 0.800
stealthchop_threshold: 999999
;hold_current: 0.200
diag_pin: ^PD2
driver_SGTHRS: 50
#interpolate: False

[tmc2209 stepper_z]
uart_pin: PB10
run_current: 0.700
stealthchop_threshold: 999999
#interpolate: False
#diag_pin: ^PC3

[tmc2209 stepper_z1]
uart_pin: PA6
run_current: 0.700
stealthchop_threshold: 999999
#interpolate: False
#diag_pin: PC3

[tmc2209 extruder]
uart_pin: PB2
run_current: 0.600
#diag_pin: PC2

#[tmc2209 extruder1]
#uart_pin: PA6
#run_current: 0.600
#diag_pin:


[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PD5, EXP1_3=PB3, EXP1_5=PB5, EXP1_7=PB7, EXP1_9=<GND>,
    EXP1_2=PD4,  EXP1_4=PD6, EXP1_6=PB4, EXP1_8=PB6, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PB14, EXP2_3=PB8, EXP2_5=PC10, EXP2_7=PC12,  EXP2_9=<GND>,
    EXP2_2=PB13, EXP2_4=PB9, EXP2_6=PB15, EXP2_8=<RST>, EXP2_10=<NC>

# See the sample-lcd.cfg file for definitions of common LCD displays.

#[bltouch]
#sensor_pin: PC13
#control_pin: PC15

# Proximity switch
[probe]
pin: !PC15
# Subtract to lift the print head.
z_offset: -0.015
x_offset: 0
y_offset: 0
speed: 10
samples: 2
sample_retract_dist: 2.0
samples_tolerance_retries: 1
lift_speed: 15
activate_gcode:
    G4 P220 ;Wait 200ms
    ;SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.2
    ;SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT=0.2
deactivate_gcode:
    ;{% set run_current = printer.configfile.config['tmc2209 stepper_z'].run_current | float %}
    ;SET_TMC_CURRENT STEPPER=stepper_z CURRENT={run_current}
    ;SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={run_current}


[safe_z_home]
home_xy_position: 162, 162
z_hop: 5

[bed_mesh]
speed: 120
horizontal_move_z: 3
mesh_min: 5, 0
mesh_max: 175, 175
mesh_pps: 3
adaptive_margin: 5
probe_count: 7, 7
#algorithm: lagrange
algorithm: bicubic
bicubic_tension: 0.4

[exclude_object]


#[neopixel my_neopixel1]
#pin: PC11

#[neopixel my_neopixel2]
#pin: PC14

