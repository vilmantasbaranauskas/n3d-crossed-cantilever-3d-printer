[mcu btt_adxl345]
serial: /dev/serial/by-id/usb-Klipper_rp2040_45474E621A84E4DA-if00

[adxl345]
cs_pin: btt_adxl345:gpio9
#spi_bus: spi1a
spi_software_sclk_pin: btt_adxl345:gpio10
spi_software_mosi_pin: btt_adxl345:gpio11
spi_software_miso_pin: btt_adxl345:gpio8
axes_map: -z,x,y

[resonance_tester]
accel_chip: adxl345
accel_chip_z: adxl345
max_freq: 90
#max_smoothing: 0.25
probe_points:
    # Somewhere slightly above the middle of your print bed
     90,90,20
     90,90,120
